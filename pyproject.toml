[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "ocrs"
version = "0.2.4"
description = "Local screenshot order collection and review"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "pydantic>=2.10,<3",
    "httpx>=0.28,<1",
    "Pillow>=11,<13",
    "openpyxl>=3.1,<4",
    "filelock>=3.17,<4",
    "python-multipart>=0.0.20,<1",
    "python-dotenv>=1,<2",
    "cryptography>=44,<47",
    "httpcore>=1,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "mypy>=1.15,<2", "types-openpyxl>=3.1", "build>=1.2,<2"]

[project.scripts]
ocrs = "ocrs.cli:main"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
