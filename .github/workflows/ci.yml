name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      OCRS_PROVIDER: demo
      OCRS_ALLOW_EXTERNAL: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.23'
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked dependencies
        run: uv sync --locked --python 3.12
      - name: Lint
        run: uv run --locked ruff check .
      - name: Check formatting
        run: uv run --locked ruff format --check .
      - name: Check browser JavaScript syntax
        run: node --check src/ocrs/static/app.js
      - name: Check types
        run: uv run --locked mypy src
      - name: Run offline tests
        run: uv run --locked pytest
      - name: Build distributions
        run: uv build
